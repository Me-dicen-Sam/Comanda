{% extends "base.html" %}
{% block title %}Calificar · COMANDA{% endblock %}
{% block content %}
<div class="max-w-md mx-auto">
  <form method="post" class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6 space-y-5">
    {% csrf_token %}
    <h1 class="text-2xl font-extrabold">Califica tu pedido</h1>
    <div><label for="pc" class="font-semibold">{{ p.establecimiento.nombre }}: <strong id="vc" class="text-[#FF441F]">5</strong>/5</label>
      <input type="range" id="pc" name="puntaje_cafeteria" min="1" max="5" step="1" value="5" oninput="vc.textContent=this.value" class="w-full mt-2 accent-[#FF441F]">
      <div class="flex justify-between text-xs text-gray-500"><span>1 · Malo</span><span>5 · Excelente</span></div></div>
    <div><label for="pr" class="font-semibold">Repartidor {{ rep.nombre }}: <strong id="vr" class="text-[#FF441F]">5</strong>/5</label>
      <input type="range" id="pr" name="puntaje_repartidor" min="1" max="5" step="1" value="5" oninput="vr.textContent=this.value" class="w-full mt-2 accent-[#FF441F]">
      <div class="flex justify-between text-xs text-gray-500"><span>1 · Malo</span><span>5 · Excelente</span></div></div>
    <div><label for="comentario" class="block text-sm font-semibold mb-1">Comentario (opcional)</label>
      <input id="comentario" name="comentario" maxlength="255" class="w-full rounded-xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-[#FF441F]"></div>
    <button class="w-full bg-[#FF441F] hover:bg-[#e03816] text-white font-bold py-3 rounded-xl shadow">Enviar calificación</button>
  </form>
</div>
{% endblock %}
